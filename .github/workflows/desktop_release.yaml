name: Desktop Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "GitHub release tag to attach DMGs to (e.g. v1.0.3)"
        required: true
        type: string

env:
  NODE_OPTIONS: "--max-old-space-size=4096"

jobs:
  build:
    permissions:
      contents: write
    runs-on: macos-latest
    strategy:
      fail-fast: true
      matrix:
        include:
          - target: aarch64-apple-darwin
            artifact: notiz-macos-silicon.dmg

    steps:
      - uses: actions/checkout@v4
        with:
          lfs: true
          submodules: recursive

      - uses: ./.github/actions/rust_install
        with:
          platform: macos

      - uses: ./.github/actions/pnpm_install

      - name: Build UI
        run: pnpm -F @notiz/ui build

      - name: Import Apple certificate
        uses: ./.github/actions/apple_cert
        id: apple-cert
        with:
          apple-certificate: ${{ secrets.APPLE_CERTIFICATE }}
          apple-certificate-password: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          keychain-password: ${{ secrets.KEYCHAIN_PASSWORD }}

      - name: Verify Apple notarization credentials
        run: |
          xcrun notarytool history \
            --apple-id "$APPLE_ID" \
            --password "$APPLE_PASSWORD" \
            --team-id "$APPLE_TEAM_ID" > /dev/null
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}

      - name: Stage bundled llama-server
        run: ./apps/desktop/src-tauri/scripts/fetch-llama-server.sh

      - name: Build desktop app
        run: |
          BUILD_ARGS=(
            --target "${{ matrix.target }}"
            --config "src-tauri/tauri.conf.stable.json"
          )
          pnpm -F @notiz/desktop tauri build "${BUILD_ARGS[@]}"
        env:
          CI: false
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple-cert.outputs.cert-id }}

      - name: Notarize DMG
        uses: ./.github/actions/macos_notarize_dmg
        with:
          dmg-path: apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/*.dmg
          signing-identity: ${{ steps.apple-cert.outputs.cert-id }}
          apple-id: ${{ secrets.APPLE_ID }}
          apple-password: ${{ secrets.APPLE_PASSWORD }}
          apple-team-id: ${{ secrets.APPLE_TEAM_ID }}

      - name: Rename and upload DMG
        run: |
          DMG=$(find apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/dmg/ -name "*.dmg" | head -1)
          cp "$DMG" "${{ matrix.artifact }}"
          gh release upload "${{ inputs.tag }}" "${{ matrix.artifact }}" --clobber
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
