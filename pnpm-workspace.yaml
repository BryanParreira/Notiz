packages:
  - apps/*
  - packages/*
  - plugins/*
  - examples/plugins/*
  - e2e/*

publicHoistPattern:
  - "!bun-types"
  - "!@types/bun"

overrides:
  prosemirror-view: "1.42.6"
  prosemirror-model: "1.25.12"
  markdown-it: "^14.3.1"
  linkify-it: "^5.0.2"
  mermaid: "^11.16.1"
  js-yaml: "^4.3.2"
  nanoid: "^3.3.18"
  "uuid@^11": "^11.1.1"
  "uuid@^13": "^13.0.1"
  colord: "^2.9.4"
  undici: "^7.29.1"
  ws: "^8.21.0"
  hono: "^4.13.7"
  seroval: "^1.6.3"
  drizzle-orm: "^0.45.2"
  postcss: "^8.5.23"
  js-cookie: "^3.0.6"
  browserslist: "^4.28.7"
  source-map-js: "^1.2.2"
  vite: "^8.0.16"
  smol-toml: "^1.8.1"
  protobufjs: "^7.6.5"
  "@grpc/grpc-js": "^1.14.5"
  lightningcss: "1.30.1"

peerDependencyRules:
  allowedVersions:
    motion: "11"
    react: "19"
    "@lobehub/ui": "3.4.0"
    unist-util-visit: "5"
    esbuild: "0.25"

allowBuilds:
  "@infisical/cli": true
  "@parcel/watcher": true
  "@sentry/cli": true
  cbor-extract: true
  core-js: true
  dprint: true
  edgedriver: true
  esbuild: true
  geckodriver: true
  netlify: true
  protobufjs: true
  puppeteer: true
  sharp: true
  supabase: true
  unix-dgram: true
